<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NHCLC Payment Gateway</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 16px;

        background: linear-gradient(
          135deg,
          #f0f9ff 0%,
          #e0f2fe 50%,
          #f0fdf4 100%
        );

        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";

        position: fixed;

        width: 280px;
        height: 280px;

        border-radius: 50%;

        filter: blur(90px);

        opacity: 0.35;

        z-index: 0;
      }

      body::before {
        background: #bae6fd;

        top: -80px;
        left: -80px;
      }

      body::after {
        background: #bbf7d0;

        bottom: -80px;
        right: -80px;
      }

      .card {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 420px;

        background: rgba(255, 255, 255, 0.96);

        border-radius: 28px;

        padding: 32px 24px;

        text-align: center;

        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);

        border: 1px solid #ffffff;
      }

      .logo {
        width: 95px;
        height: 95px;

        border-radius: 50%;

        object-fit: cover;

        background: white;

        margin-bottom: 18px;

        border: 1px solid #e2e8f0;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
      }

      h1 {
        font-size: 24px;

        color: #0f172a;

        font-weight: 700;

        line-height: 1.4;
      }

      .branch {
        margin-top: 6px;

        color: #64748b;

        font-size: 15px;
      }

      .loader-wrapper {
        position: relative;

        width: 90px;
        height: 90px;

        margin: 28px auto 20px;
      }

      .loader-ring {
        width: 100%;
        height: 100%;

        border-radius: 50%;

        border: 5px solid #e2e8f0;

        border-top-color: #1664a3;

        animation: rotate 1s linear infinite;
      }

      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }

      .center-upi {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        width: 62px;
        height: 62px;

        border-radius: 50%;

        background: white;

        display: flex;
        justify-content: center;
        align-items: center;

        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
      }

      .center-upi img {
        width: 38px;
      }

      .processing {
        font-size: 22px;

        font-weight: 600;

        color: #0f172a;
      }

      .message {
        margin-top: 10px;

        color: #64748b;

        font-size: 14px;

        line-height: 1.7;
      }

      .amount-box {
        margin-top: 22px;

        background: #f8fafc;

        border-radius: 16px;

        padding: 16px;
      }

      .amount-label {
        color: #64748b;

        font-size: 13px;
      }

      .amount {
        margin-top: 4px;

        font-size: 30px;

        font-weight: 700;

        color: #1664a3;
      }

      .pay-btn {
        width: 100%;

        margin-top: 24px;

        border: none;

        cursor: pointer;

        padding: 15px 20px;

        border-radius: 16px;

        background: linear-gradient(135deg, #1664a3, #0f4d7a);

        color: white;

        font-size: 16px;

        font-weight: 600;

        transition: 0.2s;
      }

      .pay-btn:active {
        transform: scale(0.98);
      }

      .secure-badge {
        margin-top: 18px;

        display: inline-block;

        padding: 7px 15px;

        border-radius: 999px;

        background: #f0fdf4;

        border: 1px solid #dcfce7;

        color: #15803d;

        font-size: 12px;

        font-weight: 600;
      }

      .footer-note {
        margin-top: 18px;

        color: #94a3b8;

        font-size: 12px;

        line-height: 1.6;
      }

      @media (max-width: 480px) {
        .card {
          padding: 26px 18px;
        }

        h1 {
          font-size: 20px;
        }

        .processing {
          font-size: 19px;
        }

        .amount {
          font-size: 26px;
        }

        .pay-btn {
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <img src="/logo.png" class="logo" />

      <h1>New Horizons Computer Learning Centre</h1>

      <div class="branch">Darbhanga • Branch Tarsarai</div>

      <div class="loader-wrapper">
        <div class="loader-ring"></div>

        <div class="center-upi">
          <img src="/upi.png" />
        </div>
      </div>

      <div class="processing">Secure UPI Payment</div>

      <div class="message">
        Click the button below to securely open your preferred UPI application.
      </div>

      <div class="amount-box">
        <div class="amount-label">Payable Amount</div>

        <div class="amount" id="amount">₹0</div>
      </div>

      <button class="pay-btn" id="payBtn">Open UPI App</button>

      <div class="secure-badge">🔒 Secured by NHCLC Payment Gateway</div>

      <div class="footer-note">
        Do not refresh or close this page during payment processing.
      </div>
    </div>

    <script>
      const SECRET_KEY = "NHCLC_SECURE_2026";

      function decodeData(str) {
        str += "=".repeat((4 - (str.length % 4)) % 4);

        return JSON.parse(atob(str.replace(/-/g, "+").replace(/_/g, "/")));
      }

      async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);

        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);

        const hashArray = Array.from(new Uint8Array(hashBuffer));

        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      }

      async function initPayment() {
        try {
          const pathParts = window.location.pathname.split("/");

          const encodedData = pathParts[2];

          const decoded = decodeData(encodedData);

          const raw = `${decoded.am}:${decoded.tn}:${decoded.ts}:${SECRET_KEY}`;

          const hash = await sha256(raw);

          const expectedSignature = hash.substring(0, 16);

          // Verify Signature
          if (expectedSignature !== decoded.sg) {
            document.body.innerHTML = "<h2>Invalid Payment Link</h2>";

            return;
          }

          // Expiry Check (30 min)
          const now = Math.floor(Date.now() / 1000);

          if (now - decoded.ts > 1800) {
            document.body.innerHTML = "<h2>Payment Link Expired</h2>";

            return;
          }

          document.getElementById("amount").innerText = `₹${decoded.am}`;

          const upiLink =
            `upi://pay?pa=adityaalok2004@okhdfcbank` +
            `&pn=${encodeURIComponent("Aditya Alok")}` +
            `&tr=${encodeURIComponent(decoded.tr)}` +
            `&am=${decoded.am}` +
            `&cu=INR` +
            `&tn=${encodeURIComponent(decoded.tn)}`;

          document.getElementById("payBtn").addEventListener("click", () => {
            window.location.href = upiLink;
          });
        } catch {
          document.body.innerHTML = "<h2>Invalid Payment Link</h2>";
        }
      }

      initPayment();
    </script>
  </body>
</html>
